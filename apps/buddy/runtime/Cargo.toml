[package]
name = "lexora-buddy-runtime"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = [ "runtime" ]
pet-core = [
  "dep:libc",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:uuid"
]
pet = [
  "pet-core",
  "dep:cairo-rs",
  "dep:gdk",
  "dep:gdk-pixbuf",
  "dep:glib",
  "dep:gtk",
  "dep:libloading"
]
runtime = [
  "pet-core",
  "dep:base64",
  "dep:rusqlite"
]

[[bin]]
name = "lexora-buddy-runtime"
path = "src/main.rs"
required-features = [ "runtime" ]

[[bin]]
name = "lexora-buddy-pet"
path = "src/bin/lexora-buddy-pet.rs"
required-features = [ "pet" ]

[dependencies]
base64 = { version = "0.22", optional = true }
cairo-rs = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
gdk-pixbuf = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
libc = { version = "0.2", optional = true }
libloading = { version = "0.7", optional = true }
rusqlite = { version = "0.37", features = [ "bundled" ], optional = true }
serde = { version = "1", features = [ "derive" ], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
uuid = { version = "1", features = [
  "v4",
  "v7"
], optional = true }
